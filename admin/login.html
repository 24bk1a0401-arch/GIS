<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login &bull; GeoSafe GIS Emergency Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b18;
      --card-bg: #0c1428;
      --card-border: rgba(120, 200, 255, 0.16);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --cyan: #22d3ee;
      --text: #f0f6fc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --danger: #ef4444;
      --font-sans: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 26px;
      margin: 0 auto 12px;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
    }

    .brand-header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-header p {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #060b18;
      color: var(--text);
      font-size: 0.95rem;
      transition: all 0.15s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
    }

    .btn-submit {
      width: 100%;
      height: 46px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.84rem;
      margin-bottom: 20px;
      display: none;
    }

    .demo-credentials-box {
      margin-top: 24px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 0.78rem;
    }

    .demo-credentials-box h5 {
      color: var(--cyan);
      font-size: 0.8rem;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .demo-role-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .demo-role-row span.code {
      font-family: var(--font-mono);
      color: var(--text);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-icon">🌐</div>
      <h1>GeoSafe GIS</h1>
      <p>Administrative Control Center &bull; Emergency Dispatch</p>
    </div>

    <div class="card">
      <div class="error-banner" id="errorBanner"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="usernameInput">Username or Administrator Email</label>
          <input type="text" id="usernameInput" placeholder="admin" required autofocus>
        </div>

        <div class="form-group">
          <label for="passwordInput">Secret Password</label>
          <input type="password" id="passwordInput" placeholder="••••••••••••" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Authenticate &amp; Open Dashboard</button>
      </form>

      <div class="demo-credentials-box">
        <h5>Default Provisioned Roles:</h5>
        <div class="demo-role-row">
          <span>Super Admin:</span>
          <span class="code">admin / GeoSafeAdmin2026!</span>
        </div>
        <div class="demo-role-row">
          <span>Data Manager:</span>
          <span class="code">analyst / GeoSafeAnalyst2026!</span>
        </div>
        <div class="demo-role-row">
          <span>Read-Only Viewer:</span>
          <span class="code">viewer / GeoSafeViewer2026!</span>
        </div>
      </div>
    </div>

    <a href="/" class="back-link">&larr; Return to Public Community Portal</a>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const errBanner = document.getElementById('errorBanner');
      const submitBtn = document.getElementById('submitBtn');
      errBanner.style.display = 'none';

      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying Credentials...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const json = await res.json();
        if (json.success) {
          localStorage.setItem('geosafe_user', JSON.stringify(json.user));
          if (json.token) localStorage.setItem('geosafe_token', json.token);
          window.location.href = '/admin';
        } else {
          errBanner.textContent = json.error || 'Authentication rejected.';
          errBanner.style.display = 'block';
        }
      } catch (err) {
        errBanner.textContent = 'Server connection error. Please verify backend is running.';
        errBanner.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Authenticate & Open Dashboard';
      }
    });
  </script>
</body>
</html>
